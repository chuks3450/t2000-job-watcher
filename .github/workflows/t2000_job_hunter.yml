name: T2000 Job Hunter

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: t2000-job-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Install T2000 CLI
        run: |
          npm install -g @t2000/cli
          t2 --version

      - name: Restore seen jobs
        uses: actions/cache/restore@v4
        with:
          path: /tmp/t2000-seen.txt
          key: t2000-seen-${{ github.run_number }}
          restore-keys: |
            t2000-seen-

      - name: Check T2000 jobs
        run: |
          if [ ! -f /tmp/t2000-seen.txt ]; then
            touch /tmp/t2000-seen.txt
          fi

          t2 --json job board > /tmp/jobs.json

          echo "Current T2000 board:"
          cat /tmp/jobs.json

      - name: Find and auto-claim qualifying jobs
        id: claim
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.parse
          import urllib.request

          # Temporary basic screening rules.
          # These are NOT the full Claude job-worthiness criteria yet.
          MIN_PAYOUT = 0.05
          MIN_SLA = 30

          data = json.load(open("/tmp/jobs.json"))
          jobs = data.get("openJobs", [])

          seen_file = "/tmp/t2000-seen.txt"

          with open(seen_file, "r") as f:
              seen = set(x.strip() for x in f if x.strip())

          new_jobs = []

          for job in jobs:
              job_id = str(job.get("id", "")).strip()

              if job_id and job_id not in seen:
                  new_jobs.append(job)

          print(f"Open jobs: {len(jobs)}")
          print(f"New jobs: {len(new_jobs)}")

          def telegram(message):
              url = (
                  "https://api.telegram.org/bot"
                  + os.environ["TELEGRAM_BOT_TOKEN"]
                  + "/sendMessage"
              )

              payload = urllib.parse.urlencode({
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": message
              }).encode()

              urllib.request.urlopen(url, data=payload).read()

          for job in new_jobs:

              job_id = str(job.get("id", "")).strip()
              title = job.get("title", "Untitled")

              try:
                  payout = float(job.get("maxUsdc", 0))
              except (TypeError, ValueError):
                  payout = 0

              try:
                  sla = float(job.get("slaMinutes", 0))
              except (TypeError, ValueError):
                  sla = 0

              print("")
              print("================================")
              print(f"Job: {title}")
              print(f"ID: {job_id}")
              print(f"Payout: ${payout:.2f}")
              print(f"SLA: {sla:.0f} minutes")
              print("================================")

              qualifies = (
                  payout >= MIN_PAYOUT
                  and sla >= MIN_SLA
              )

              # -------------------------------------------------
              # JOB DOES NOT PASS BASIC SCREENING
              # -------------------------------------------------
              if not qualifies:
                  print("CHECK: Job does not meet basic screening rules.")

                  telegram(
                      f"👀 T2000 JOB DETECTED\n\n"
                      f"Title: {title}\n"
                      f"Payout: ${payout:.2f} USDC\n"
                      f"SLA: {sla:.0f} minutes\n"
                      f"Job ID: {job_id}\n\n"
                      f"⚠️ This job doesn't meet our basic criteria,\n"
                      f"but it may be worth checking.\n\n"
                      f"WildForce Scout detected this job."
                  )

                  with open(seen_file, "a") as f:
                      f.write(job_id + "\n")

                  continue

              # -------------------------------------------------
              # JOB PASSES BASIC SCREENING
              # -------------------------------------------------
              print("QUALIFIES: Attempting automatic claim...")

              telegram(
                  f"🚨 T2000 JOB MATCH\n\n"
                  f"Title: {title}\n"
                  f"Payout: ${payout:.2f} USDC\n"
                  f"SLA: {sla:.0f} minutes\n"
                  f"Job ID: {job_id}\n\n"
                  f"✅ Passed our basic screening.\n"
                  f"⚡ Attempting to claim immediately.\n\n"
                  f"WildForce Scout"
              )

              result = subprocess.run(
                  ["t2", "job", "claim", job_id],
                  text=True,
                  capture_output=True
              )

              print("Claim stdout:")
              print(result.stdout)

              print("Claim stderr:")
              print(result.stderr)

              # -------------------------------------------------
              # CLAIM SUCCESSFUL
              # -------------------------------------------------
              if result.returncode == 0:
                  print("CLAIM SUCCESSFUL")

                  telegram(
                      f"🟢 T2000 JOB CLAIMED\n\n"
                      f"Title: {title}\n"
                      f"Payout: ${payout:.2f} USDC\n"
                      f"SLA: {sla:.0f} minutes\n"
                      f"Job ID: {job_id}\n\n"
                      f"✅ Passed our basic screening.\n"
                      f"⚡ WildForce Scout claimed it automatically.\n\n"
                      f"⛔ No work has been executed yet."
                  )

              # -------------------------------------------------
              # CLAIM FAILED
              # -------------------------------------------------
              else:
                  print("CLAIM FAILED")

                  error = (result.stderr or result.stdout).strip()

                  if not error:
                      error = "Unknown claim error."

                  telegram(
                      f"⚠️ T2000 AUTO-CLAIM FAILED\n\n"
                      f"Title: {title}\n"
                      f"Payout: ${payout:.2f} USDC\n"
                      f"SLA: {sla:.0f} minutes\n"
                      f"Job ID: {job_id}\n\n"
                      f"❌ The job passed basic screening,\n"
                      f"but the automatic claim failed.\n\n"
                      f"Error:\n"
                      f"{error[:1000]}"
                  )

              # Mark the job as seen so we don't repeatedly alert
              # about the same listing.
              with open(seen_file, "a") as f:
                  f.write(job_id + "\n")

          if not new_jobs:
              print("No new jobs.")

          PY

      - name: Save seen jobs
        uses: actions/cache/save@v4
        with:
          path: /tmp/t2000-seen.txt
          key: t2000-seen-${{ github.run_number }}
