name: T2000 Job Hunter

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: t2000-job-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. INSTALL T2000 CLI
      # =========================================================

      - name: Install T2000 CLI
        run: |
          set -euo pipefail

          npm install -g @t2000/cli

          echo "T2000 CLI version:"
          t2 --version


      # =========================================================
      # 2. RESTORE CHUKSBLADES WALLET
      # =========================================================

      - name: Restore ChuksBlades wallet
        env:
          T2000_WALLET_KEY: ${{ secrets.T2000_WALLET_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${T2000_WALLET_KEY:-}" ]; then
            echo "ERROR: T2000_WALLET_KEY secret is missing."
            exit 1
          fi

          mkdir -p "$HOME/.t2000"

          umask 077

          printf '%s' "$T2000_WALLET_KEY" \
            > "$HOME/.t2000/wallet.key"

          chmod 600 "$HOME/.t2000/wallet.key"

          echo "ChuksBlades wallet restored."


      # =========================================================
      # 3. VERIFY WALLET WITHOUT MAKING A TRANSACTION
      # =========================================================

      - name: Verify ChuksBlades wallet
        run: |
          set -euo pipefail

          echo "Checking ChuksBlades wallet..."

          t2 status

          echo "Wallet verification completed."


      # =========================================================
      # 4. RESTORE HUNTER STATE
      # =========================================================

      - name: Restore ChuksBlades hunter state
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/t2000-seen.txt
            /tmp/t2000-claimed-titles.txt
          key: chuksblades-seen-${{ github.run_id }}
          restore-keys: |
            chuksblades-seen-


      # =========================================================
      # 5. CHECK LIVE T2000 BOARD
      # =========================================================

      - name: Check T2000 jobs
        run: |
          set -euo pipefail

          if [ ! -f /tmp/t2000-seen.txt ]; then
            touch /tmp/t2000-seen.txt
          fi

          if [ ! -f /tmp/t2000-claimed-titles.txt ]; then
            touch /tmp/t2000-claimed-titles.txt
          fi

          t2 --json job board / > /tmp/jobs.json

          echo "T2000 board checked successfully."

          python - <<'PY'
          import json

          with open("/tmp/jobs.json", "r") as f:
              data = json.load(f)

          jobs = data.get("openJobs", [])

          print(f"Open jobs on board: {len(jobs)}")
          PY


      # =========================================================
      # 6. SCREEN AND AUTO-CLAIM QUALIFYING JOBS
      # =========================================================

      - name: Find and auto-claim qualifying jobs
        id: claim
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.parse
          import urllib.request


          # =====================================================
          # CHUKSBLADES HUNTER SETTINGS
          # =====================================================

          # Minimum acceptable payout.
          MIN_PAYOUT = 0.05

          # Avoid extremely short jobs.
          MIN_SLA_MINUTES = 30

          # VERY IMPORTANT:
          #
          # Only ONE successful claim is allowed per workflow run.
          #
          # After one successful claim, the hunter stops immediately.
          MAX_NEW_CLAIMS_PER_RUN = 1


          # =====================================================
          # HARD EXCLUSION RULES
          # =====================================================
          #
          # These are jobs we do NOT want to claim automatically.
          #
          # The rules focus on actions rather than words such as
          # "token" appearing somewhere in a description.
          #
          # This prevents innocent jobs mentioning crypto/token
          # from being rejected unnecessarily.
          #

          HARD_EXCLUSION_RULES = [

              # -------------------------------------------------
              # SWAPS
              # -------------------------------------------------

              (
                  "swap / token exchange",
                  [
                      "swap",
                      "swapping",
                      "swap to",
                      "swap into",
                      "swap→",
                  ]
              ),

              # -------------------------------------------------
              # BURN / DESTROY / SINK
              # -------------------------------------------------

              (
                  "burn / destroy / sink",
                  [
                      "burn",
                      "burning",
                      "destroy token",
                      "destroy asset",
                      "destroying token",
                      "destroying asset",
                      "sink token",
                      "sink asset",
                      "sink",
                  ]
              ),

              # -------------------------------------------------
              # BUY / PURCHASE
              # -------------------------------------------------

              (
                  "buy / purchase",
                  [
                      "buy token",
                      "buy tokens",
                      "buy coin",
                      "buy coins",
                      "buy asset",
                      "buy assets",
                      "buy nft",
                      "buy an nft",
                      "buy item",
                      "purchase token",
                      "purchase tokens",
                      "purchase coin",
                      "purchase coins",
                      "purchase asset",
                      "purchase assets",
                      "purchase nft",
                      "purchase an nft",
                  ]
              ),

              # -------------------------------------------------
              # SELL
              # -------------------------------------------------

              (
                  "selling",
                  [
                      "sell token",
                      "sell tokens",
                      "sell coin",
                      "sell coins",
                      "sell asset",
                      "sell assets",
                      "sell nft",
                      "sell an nft",
                  ]
              ),

              # -------------------------------------------------
              # FINANCIAL SPENDING
              # -------------------------------------------------

              (
                  "spending / funding",
                  [
                      "spend usdc",
                      "spend sui",
                      "spend funds",
                      "spending usdc",
                      "spending sui",
                      "spending funds",
                      "fund wallet",
                      "fund the wallet",
                      "fund account",
                      "fund the account",
                      "fund a wallet",
                      "fund an account",
                      "funding wallet",
                      "funding account",
                      "pay a fee",
                      "pay the fee",
                      "pay gas",
                      "pay for",
                      "payment required",
                      "payment of",
                  ]
              ),

              # -------------------------------------------------
              # DEPOSIT / WITHDRAW
              # -------------------------------------------------

              (
                  "deposit / withdrawal",
                  [
                      "deposit",
                      "deposit funds",
                      "deposit usdc",
                      "deposit sui",
                      "withdraw",
                      "withdrawal",
                      "withdraw funds",
                      "withdraw usdc",
                      "withdraw sui",
                  ]
              ),

              # -------------------------------------------------
              # TRANSFERS / SENDING FUNDS
              # -------------------------------------------------

              (
                  "wallet transfer / sending funds",
                  [
                      "send usdc",
                      "send sui",
                      "send funds",
                      "send tokens",
                      "send crypto",
                      "send payment",
                      "transfer usdc",
                      "transfer sui",
                      "transfer funds",
                      "transfer tokens",
                      "transfer crypto",
                      "transfer payment",
                      "transferring usdc",
                      "transferring sui",
                      "transferring funds",
                      "transferring tokens",
                  ]
              ),

              # -------------------------------------------------
              # WALLET / PASSPORT TRANSACTIONS
              # -------------------------------------------------

              (
                  "wallet / Passport transaction",
                  [
                      "passport connect",
                      "passport transaction",
                      "passport transaction",
                      "connect wallet",
                      "wallet connect",
                      "connect your wallet",
                      "connect the wallet",
                      "sign transaction",
                      "sign a transaction",
                      "sign the transaction",
                      "sign on-chain transaction",
                      "approve transaction",
                      "approve a transaction",
                      "approve the transaction",
                      "on-chain transaction",
                      "on chain transaction",
                      "blockchain transaction",
                      "execute transaction",
                      "execute a transaction",
                      "submit transaction",
                      "submit a transaction",
                  ]
              ),

              # -------------------------------------------------
              # REFERRALS / RECRUITMENT
              # -------------------------------------------------

              (
                  "referral / recruitment",
                  [
                      "refer an agent",
                      "refer a new agent",
                      "refer another agent",
                      "refer someone",
                      "referral",
                      "referrals",
                      "recruit an agent",
                      "recruit another agent",
                      "recruiting",
                      "invite an agent",
                      "invite another agent",
                      "invite someone",
                      "invitation",
                      "bring another agent",
                      "bring a new agent",
                  ]
              ),

              # -------------------------------------------------
              # MINTING
              # -------------------------------------------------

              (
                  "mint / asset creation",
                  [
                      "mint nft",
                      "mint an nft",
                      "mint token",
                      "mint tokens",
                      "mint asset",
                      "mint an asset",
                      "minting nft",
                      "minting token",
                      "minting tokens",
                  ]
              ),

              # -------------------------------------------------
              # KNOWN DESK / PROOF / ENGAGEMENT JOBS
              # -------------------------------------------------

              (
                  "known desk / proof job",
                  [
                      "seller path",
                      "job loop",
                      "social comment",
                      "metrics",
                      "pack",
                      "board pulse",
                      "connect smoke",
                      "honest friction",
                      "storefront",
                      "skills",
                      "complete one full buyer loop",
                      "buyer loop",
                  ]
              ),
          ]


          # =====================================================
          # LOAD BOARD
          # =====================================================

          with open("/tmp/jobs.json", "r") as f:
              data = json.load(f)

          jobs = data.get("openJobs", [])


          # =====================================================
          # STATE FILES
          # =====================================================

          seen_file = "/tmp/t2000-seen.txt"
          claimed_titles_file = "/tmp/t2000-claimed-titles.txt"


          with open(seen_file, "r") as f:
              seen = {
                  line.strip()
                  for line in f
                  if line.strip()
              }


          with open(claimed_titles_file, "r") as f:
              claimed_titles = {
                  line.strip()
                  for line in f
                  if line.strip()
              }


          # =====================================================
          # TELEGRAM
          # =====================================================

          def telegram(message):
              token = os.environ.get("TELEGRAM_BOT_TOKEN")
              chat_id = os.environ.get("TELEGRAM_CHAT_ID")

              if not token or not chat_id:
                  print("Telegram secrets are not configured.")
                  return

              url = (
                  "https://api.telegram.org/bot"
                  + token
                  + "/sendMessage"
              )

              payload = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": message
              }).encode()

              try:
                  urllib.request.urlopen(
                      url,
                      data=payload,
                      timeout=15
                  ).read()

              except Exception as exc:
                  print(
                      "Telegram notification failed:",
                      str(exc)
                  )


          # =====================================================
          # HELPERS
          # =====================================================

          def first_value(job, *keys, default=None):
              for key in keys:
                  if key in job and job[key] is not None:
                      return job[key]

              return default


          def as_float(value, default=0.0):
              try:
                  return float(value)

              except (TypeError, ValueError):
                  return default


          def as_int(value, default=0):
              try:
                  return int(float(value))

              except (TypeError, ValueError):
                  return default


          def job_text(job):
              pieces = []

              for key in [
                  "title",
                  "need",
                  "description",
                  "brief",
                  "preview"
              ]:

                  value = job.get(key)

                  if value is not None:
                      pieces.append(str(value))

              return " ".join(pieces).lower()


          def normalize_title(title):
              """
              Converts a job title into a stable comparison key.

              Example:

              "Write a Report - SUI"
              "write a report sui"

              become approximately the same key.
              """

              value = title.lower()

              value = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  value
              )

              value = re.sub(
                  r"\s+",
                  " ",
                  value
              )

              return value.strip()


          def append_seen(job_id):
              if job_id not in seen:
                  with open(seen_file, "a") as f:
                      f.write(job_id + "\n")

                  seen.add(job_id)


          def append_claimed_title(title_key):
              if title_key not in claimed_titles:
                  with open(claimed_titles_file, "a") as f:
                      f.write(title_key + "\n")

                  claimed_titles.add(title_key)


          # =====================================================
          # FIND NEW JOBS
          # =====================================================

          new_jobs = []

          for job in jobs:

              job_id = str(
                  first_value(
                      job,
                      "id",
                      "openingId",
                      "openingID",
                      default=""
                  )
              ).strip()

              if not job_id:
                  continue

              if job_id not in seen:
                  new_jobs.append(job)


          print(f"Open jobs: {len(jobs)}")
          print(f"New unseen jobs: {len(new_jobs)}")


          # =====================================================
          # PROCESS JOBS
          # =====================================================

          successful_claims = 0


          for job in new_jobs:

              # -------------------------------------------------
              # ABSOLUTE ONE-CLAIM LIMIT
              # -------------------------------------------------

              if successful_claims >= MAX_NEW_CLAIMS_PER_RUN:

                  print(
                      "One successful claim has already been made."
                  )

                  print(
                      "Stopping hunter immediately."
                  )

                  break


              # -------------------------------------------------
              # BASIC JOB INFORMATION
              # -------------------------------------------------

              job_id = str(
                  first_value(
                      job,
                      "id",
                      "openingId",
                      "openingID",
                      default=""
                  )
              ).strip()


              title = str(
                  first_value(
                      job,
                      "title",
                      default="Untitled job"
                  )
              ).strip()


              status = str(
                  first_value(
                      job,
                      "status",
                      default="open"
                  )
              ).lower().strip()


              payout = as_float(
                  first_value(
                      job,
                      "maxUsdc",
                      "maxUSDC",
                      "max_usdc",
                      default=0
                  )
              )


              sla = as_float(
                  first_value(
                      job,
                      "slaMinutes",
                      "sla",
                      "sla_minutes",
                      default=0
                  )
              )


              slots_total = as_int(
                  first_value(
                      job,
                      "slotsTotal",
                      "slots",
                      "totalSlots",
                      default=1
                  ),
                  default=1
              )


              slots_remaining = as_int(
                  first_value(
                      job,
                      "slotsRemaining",
                      "remainingSlots",
                      "slotsLeft",
                      default=slots_total
                  ),
                  default=slots_total
              )


              max_claims = as_int(
                  first_value(
                      job,
                      "maxClaimsPerAgent",
                      "maxClaims",
                      "perAgentLimit",
                      default=1
                  ),
                  default=1
              )


              text = job_text(job)

              title_key = normalize_title(title)


              # -------------------------------------------------
              # PRINT JOB
              # -------------------------------------------------

              print("")
              print("========================================")
              print(f"Job: {title}")
              print(f"ID: {job_id}")
              print(f"Status: {status}")
              print(f"Payout: ${payout:.2f}")
              print(f"SLA: {sla:.0f} minutes")
              print(f"Slots total: {slots_total}")
              print(f"Slots remaining: {slots_remaining}")
              print(f"Max claims per agent: {max_claims}")
              print("========================================")


              # =================================================
              # JOB MUST BE OPEN
              # =================================================

              if status != "open":

                  print(
                      "SKIP: Job is not open."
                  )

                  append_seen(job_id)

                  continue


              # =================================================
              # DUPLICATE TITLE PROTECTION
              # =================================================
              #
              # If we already claimed a job with the same
              # normalized title, do not claim another one.
              #

              if title_key in claimed_titles:

                  print(
                      "SKIP: A job with the same normalized "
                      "title has already been claimed."
                  )

                  append_seen(job_id)

                  continue


              # =================================================
              # HARD EXCLUSION CHECK
              # =================================================

              exclusion_reason = None
              exclusion_match = None


              for reason, phrases in HARD_EXCLUSION_RULES:

                  for phrase in phrases:

                      if phrase in text:

                          exclusion_reason = reason
                          exclusion_match = phrase

                          break

                  if exclusion_reason:
                      break


              if exclusion_reason:

                  print(
                      "SKIP: Hard exclusion."
                  )

                  print(
                      f"Reason: {exclusion_reason}"
                  )

                  print(
                      f"Matched: {exclusion_match}"
                  )

                  # Mark rejected jobs as seen so they do not
                  # repeatedly trigger the same decision.
                  append_seen(job_id)

                  # IMPORTANT:
                  # No Telegram message is sent for hard rejects.
                  #
                  # This prevents Telegram spam from unsuitable
                  # jobs such as swaps, burns and referrals.

                  continue


              # =================================================
              # PAYOUT CHECK
              # =================================================

              if payout < MIN_PAYOUT:

                  print(
                      f"SKIP: Payout ${payout:.2f} is below "
                      f"${MIN_PAYOUT:.2f}."
                  )

                  append_seen(job_id)

                  continue


              # =================================================
              # SLA CHECK
              # =================================================

              if sla < MIN_SLA_MINUTES:

                  print(
                      f"SKIP: SLA {sla:.0f} minutes is below "
                      f"{MIN_SLA_MINUTES} minutes."
                  )

                  append_seen(job_id)

                  continue


              # =================================================
              # SLOT CHECK
              # =================================================

              if slots_remaining <= 0:

                  print(
                      "SKIP: No remaining slots."
                  )

                  append_seen(job_id)

                  continue


              # =================================================
              # T2000 PER-AGENT LIMIT CHECK
              # =================================================

              if max_claims <= 0:

                  print(
                      "SKIP: T2000 reports no claims available "
                      "for this agent."
                  )

                  append_seen(job_id)

                  continue


              # =================================================
              # CLAIM ELIGIBILITY
              # =================================================

              allowed_by_posting = min(
                  max_claims,
                  slots_remaining
              )


              if allowed_by_posting <= 0:

                  print(
                      "SKIP: Posting does not allow another "
                      "claim for this agent."
                  )

                  append_seen(job_id)

                  continue


              # =================================================
              # QUALIFIED
              # =================================================

              print("")
              print("QUALIFIES")
              print(
                  f"T2000 allows up to {allowed_by_posting} "
                  "claim(s) for this posting."
              )
              print(
                  "Our hunter allows exactly ONE successful "
                  "claim per workflow run."
              )


              # =================================================
              # TELEGRAM PRE-CLAIM ALERT
              # =================================================

              telegram(
                  "T2000 JOB MATCH\n\n"
                  "Agent: ChuksBlades\n"
                  f"Title: {title}\n"
                  f"Payout: ${payout:.2f} USDC\n"
                  f"SLA: {sla:.0f} minutes\n"
                  f"Job ID: {job_id}\n\n"
                  f"Slots remaining: {slots_remaining}\n"
                  f"Max claims per agent: {max_claims}\n\n"
                  "Passed automatic screening.\n"
                  "Attempting claim now."
              )


              # =================================================
              # CLAIM
              # =================================================

              result = subprocess.run(
                  [
                      "t2",
                      "job",
                      "claim",
                      "--key",
                      os.path.expanduser(
                          "~/.t2000/wallet.key"
                      ),
                      job_id
                  ],
                  text=True,
                  capture_output=True,
                  timeout=60
              )


              stdout = (
                  result.stdout or ""
              ).strip()


              stderr = (
                  result.stderr or ""
              ).strip()


              # =================================================
              # SUCCESSFUL CLAIM
              # =================================================

              if result.returncode == 0:

                  successful_claims += 1


                  print("")
                  print(
                      "CLAIM SUCCESSFUL: "
                      f"ChuksBlades claimed {job_id}"
                  )


                  # Mark exact job as seen.
                  append_seen(job_id)


                  # Remember the normalized title.
                  append_claimed_title(title_key)


                  telegram(
                      "T2000 JOB CLAIMED\n\n"
                      "Agent: ChuksBlades\n"
                      f"Title: {title}\n"
                      f"Payout: ${payout:.2f} USDC\n"
                      f"SLA: {sla:.0f} minutes\n"
                      f"Job ID: {job_id}\n\n"
                      "Claim 1/1 for this run.\n\n"
                      "No work has been executed yet."
                  )


                  # =================================================
                  # CRITICAL STOP
                  # =================================================
                  #
                  # Claiming does NOT authorize execution.
                  #
                  # The automation MUST NOT:
                  #
                  # - open/execute the job
                  # - perform the requested work
                  # - submit work
                  # - deliver work
                  # - settle
                  # - reject
                  # - refund
                  # - post
                  # - make another claim
                  # - spend additional funds
                  #
                  # It stops here.
                  #

                  print("")
                  print("========================================")
                  print("CLAIM LIMIT REACHED")
                  print("========================================")
                  print(
                      "One job successfully claimed."
                  )
                  print(
                      "Stopping before any job execution."
                  )
                  print(
                      "No delivery or settlement will be attempted."
                  )
                  print("========================================")


                  break


              # =================================================
              # CLAIM FAILURE
              # =================================================

              print("")
              print("CLAIM FAILED.")


              error = (
                  stderr
                  or stdout
                  or "Unknown claim error."
              )


              print("Claim error:")
              print(error[:2000])


              # =================================================
              # WALLET ERROR DETECTION
              # =================================================
              #
              # If the wallet is invalid, there is no reason to
              # continue trying other jobs during the same run.
              #

              wallet_error_markers = [

                  "not a valid v4 wallet",
                  "no wallet found",
                  "wallet file",
                  "invalid wallet",
                  "wallet key",
                  "failed to load wallet",
                  "unable to load wallet",
              ]


              if any(
                  marker in error.lower()
                  for marker in wallet_error_markers
              ):

                  telegram(
                      "T2000 WALLET ERROR\n\n"
                      "Agent: ChuksBlades\n"
                      f"Job ID: {job_id}\n\n"
                      "The job passed screening, but the "
                      "wallet could not be used.\n\n"
                      f"Error:\n{error[:1000]}\n\n"
                      "Hunter stopped before attempting "
                      "another claim."
                  )


                  print("")
                  print(
                      "CRITICAL: Wallet/configuration error."
                  )
                  print(
                      "Stopping hunter to prevent repeated "
                      "claim failures."
                  )


                  raise SystemExit(1)


              # =================================================
              # NORMAL CLAIM FAILURE
              # =================================================
              #
              # Do NOT mark the job as seen.
              #
              # It may have been claimed by another agent,
              # or the API may have experienced a temporary
              # failure.
              #
              # Future workflow runs can reconsider it.
              #

              telegram(
                  "T2000 AUTO-CLAIM FAILED\n\n"
                  "Agent: ChuksBlades\n"
                  f"Title: {title}\n"
                  f"Payout: ${payout:.2f} USDC\n"
                  f"Job ID: {job_id}\n\n"
                  "The job passed screening, but "
                  "the claim failed.\n\n"
                  f"Error:\n{error[:1000]}"
              )


          # =====================================================
          # FINAL SUMMARY
          # =====================================================

          print("")
          print("========================================")
          print("HUNTER SUMMARY")
          print("========================================")
          print(f"Open jobs: {len(jobs)}")
          print(f"New unseen jobs: {len(new_jobs)}")
          print(f"Successful claims: {successful_claims}")
          print(
              f"Maximum claims this run: "
              f"{MAX_NEW_CLAIMS_PER_RUN}"
          )
          print("========================================")

          PY


      # =========================================================
      # 7. SAVE HUNTER STATE
      # =========================================================

      - name: Save ChuksBlades hunter state
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/t2000-seen.txt
            /tmp/t2000-claimed-titles.txt
          key: chuksblades-seen-${{ github.run_id }}


      # =========================================================
      # 8. REMOVE WALLET FROM TEMPORARY GITHUB RUNNER
      # =========================================================

      - name: Clean up ChuksBlades wallet
        if: always()
        run: |
          rm -f "$HOME/.t2000/wallet.key"
          echo "Temporary ChuksBlades wallet removed."
