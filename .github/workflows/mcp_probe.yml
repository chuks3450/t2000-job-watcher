name: AgentRouter API Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test AgentRouter
        env:
          AGENTROUTER_API_KEY: ${{ secrets.AGENTROUTER_API_KEY }}
        run: |
          set -euo pipefail

          echo "Testing AgentRouter API..."

          response=$(curl -sS \
            -w "\nHTTP_STATUS:%{http_code}" \
            https://co.agentrouter.org/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${AGENTROUTER_API_KEY}" \
            -d '{
              "model": "claude-opus-4-8",
              "messages": [
                {
                  "role": "user",
                  "content": "Reply with exactly: AGENTROUTER_OK"
                }
              ],
              "max_tokens": 20
            }')

          echo "$response"
