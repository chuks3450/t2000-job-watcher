name: T2000 MCP Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect authenticated T2000 MCP tools
        shell: bash
        env:
          T2000_MCP_TOKEN: ${{ secrets.T2000_MCP_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${T2000_MCP_TOKEN:-}" ]; then
            echo "T2000_MCP_TOKEN secret is missing"
            exit 1
          fi

          echo "Querying authenticated T2000 MCP tools..."

          curl --fail-with-body \
            --silent \
            --show-error \
            --location \
            -X POST \
            "https://mcp.t2000.ai/mcp" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -H "Authorization: Bearer ${T2000_MCP_TOKEN}" \
            --data '{
              "jsonrpc":"2.0",
              "id":1,
              "method":"tools/list",
              "params":{}
            }' \
            | tee /tmp/t2000-mcp-tools.txt

          echo
          echo "=== Checking for job-board and job-claim tools ==="

          grep -o 't2000_job_[A-Za-z0-9_]*' /tmp/t2000-mcp-tools.txt | sort -u || true

          echo
          echo "=== Probe complete: no transaction or job claim was requested ==="
