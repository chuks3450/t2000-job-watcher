name: T2000 CLI Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Install T2000 CLI
        run: |
          npm install -g @t2000/cli
          t2 --version

      - name: Check T2000 open jobs
        run: |
          echo "Checking T2000 open jobs..."
          t2 --json job board
