name: AgentRouter Claude Code Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Test Claude Code through AgentRouter
        env:
          ANTHROPIC_BASE_URL: https://co.agentrouter.org
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.AGENTROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.AGENTROUTER_API_KEY }}
          ANTHROPIC_MODEL: claude-opus-4-8
        run: |
          set -euo pipefail

          echo "Testing Claude Code through AgentRouter..."

          claude -p "Reply with exactly: AGENTROUTER_OK" \
            --model claude-opus-4-8 \
            --output-format text
