name: T2000 MCP Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect T2000 MCP tools
        shell: bash
        run: |
          set -u

          echo "Querying T2000 MCP tools/list..."
          echo

          curl \
            --silent \
            --show-error \
            --location \
            -X POST \
            "https://mcp.t2000.ai/mcp" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            --data '{
              "jsonrpc":"2.0",
              "id":1,
              "method":"tools/list",
              "params":{}
            }' \
            -w "\n\nHTTP STATUS: %{http_code}\n" \
            -o /tmp/t2000-response.txt

          echo "=== T2000 RESPONSE ==="
          cat /tmp/t2000-response.txt

          echo
          echo "=== SEARCHING FOR JOB BOARD ==="
          grep -o 't2000_job_board' /tmp/t2000-response.txt || true
